<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wetter-app</title>
  </head>
  <body>
    <div id="app">
      <div class="current-weather">
        <h2 class="current-weather__location">Mannheim</h2>
        <h1 class="current-weather__current-temperature">25c</h1>
        <p class="current-weather__condition">Sonnig</p>
        <div class="current-weather__day-temperature">
          <span class="current-weather__max-temperature">H.25</span>
          <span class="current-weather__min-temperature">T.5</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
